<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Community - Ilushare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        ILUSHARE
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="community.html">Community</a>
        <a href="post.html">Post</a>
    </nav>

</header>


<main>

    <section class="community-section">

        <h1>Community</h1>

        <p class="section-description">
            Explore memes, comics, drawings,
            illustrations, and other creations
            shared by the Ilushare community.
        </p>


        <!-- CATEGORY FILTERS -->

        <div class="filters">

            <button class="filter-button active"
                    data-category="All">
                All
            </button>

            <button class="filter-button"
                    data-category="Meme">
                Memes
            </button>

            <button class="filter-button"
                    data-category="Comic">
                Comics
            </button>

            <button class="filter-button"
                    data-category="Drawing">
                Drawings
            </button>

            <button class="filter-button"
                    data-category="Illustration">
                Illustrations
            </button>

            <button class="filter-button"
                    data-category="Other">
                Other
            </button>

        </div>


        <!-- COMMUNITY POSTS -->

        <div
            class="post-grid"
            id="community-posts"
        >

            <div class="empty-card">

                <h3>Welcome to Ilushare!</h3>

                <p>
                    Community posts will appear here
                    once people start sharing.
                </p>

            </div>

        </div>


        <!-- POST BUTTON -->

        <div class="community-post-button">

            <a
                href="post.html"
                class="button"
            >
                Share Something
            </a>

        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 Ilushare
    </p>

</footer>


<script src="app.js"></script>

</body>

</html>
